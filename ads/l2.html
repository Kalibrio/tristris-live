<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Q'; src: url('/assets/fonts/Quicksand-Bold.otf'); }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100vw; height: 100vh; overflow: hidden; }
body {
  font-family: 'Q', sans-serif;
  background: linear-gradient(160deg, #f6efdd 0%, #f2e9d2 60%, #eee4cd 100%);
  position: relative;
}
.dot { position: absolute; border-radius: 30%; }
.dot.c { border-radius: 50%; }
.left {
  position: absolute; left: 0; top: 0; width: 50vw; height: 100vh;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  gap: 3.6vh; z-index: 2;
}
.wordmark { font-size: 8.4vh; letter-spacing: .04em; }
.wordmark span { text-shadow: 0.06em 0.06em 0 #4a3319, -0.045em 0.045em 0 #4a3319, 0.045em -0.045em 0 #4a3319, -0.045em -0.045em 0 #4a3319; }
h1 { color: #4a3319; font-size: 6.2vh; line-height: 1.2; text-align: center; font-weight: normal; }
.sub { color: #7a5f3c; font-size: 4.2vh; text-align: center; }
.cta {
  background: linear-gradient(180deg, #ffc73e, #f8a909);
  border: 0.45vh solid #c48002; border-radius: 100px;
  color: #3a2602; font-size: 4.6vh; padding: 2.2vh 6vw;
  box-shadow: 0 1.2vh 2.4vh rgba(60,35,10,.35);
  letter-spacing: .06em;
}
.art {
  position: absolute; right: 4vw; top: 50%; transform: translateY(-50%);
  width: 42vw; height: 88vh; z-index: 2;
  background: #fdfbf6; border-radius: 5vh;
  box-shadow: 0 2.5vh 5vh rgba(60,35,10,.28);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.art img { width: 100%; }
</style></head>
<body>
<div class="left">
  <div class="wordmark">
    <span style="color:#f8a909">T</span><span style="color:#f43e68">R</span><span style="color:#0676fb">U</span><span style="color:#f8a909">M</span><span style="color:#0676fb">B</span><span style="color:#f43e68">L</span><span style="color:#f8a909">E</span>
  </div>
  <h1>The coziest<br>color-match puzzle.</h1>
  <div class="sub">Meet Capy. Match colors. Chill.</div>
  <div class="cta">PLAY FREE</div>
</div>
<div class="art"><img src="capy-diorama-pond.jpg"></div>
<script>
const cols = ['#f8a909', '#0676fb', '#f43e68'];
let seed = 23;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
for (let i = 0; i < 30; i++) {
  const d = document.createElement('div');
  d.className = 'dot' + (rnd() < .5 ? ' c' : '');
  const s = 8 + rnd() * 26;
  d.style.cssText += `left:${rnd() * 96}vw;top:${rnd() * 94}vh;width:${s}px;height:${s}px;background:${cols[Math.floor(rnd() * 3)]};opacity:${.14 + rnd() * .2}`;
  document.body.appendChild(d);
}
</script>
</body></html>
