<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0A1030" />
  <title>Trumble — Drop. Match. Tumble.</title>
  <meta name="description" content="Trumble — the cozy falling-block match puzzle. Drop, match, and tumble." />
  <meta property="og:title" content="Trumble" />
  <meta property="og:description" content="Drop. Match. Tumble." />
  <meta property="og:image" content="https://trumble.kalibrio.com/landing/assets/logo.png" />
  <link rel="preload" as="image" href="assets/background.png" />
  <link rel="preload" as="image" href="assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" />
  <link rel="stylesheet" href="landing.css" />
</head>
<body>
  <main class="stage" id="stage">
    <div class="bg" id="bg" aria-hidden="true"></div>
    <div class="field" id="field" aria-hidden="true">
      <div class="pieces" id="pieces"></div>
      <canvas class="fx" id="fx"></canvas>
    </div>
    <div class="hero">
      <div class="logo-wrap" id="logo">
        <div class="logo-pulse" aria-hidden="true"></div>
        <div class="logo-sweep" aria-hidden="true"></div>
        <img class="logo-img" src="assets/logo.png" alt="Trumble" draggable="false" />
      </div>
      <button class="play" id="play" type="button">PLAY&nbsp;NOW</button>
    </div>
  </main>
  <script src="landing.js"></script>
</body>
</html>
